name: armv7-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7:
    name: build linux/armv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui-log/package-lock.json

      - name: Build embedded UI
        shell: bash
        working-directory: webui-log
        run: |
          npm ci
          npm run build
          npm run build:log1

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '5'   # ZX279128S 无 VFP/NEON，必须软浮点
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "dist/mosdns" \
            ./

      - name: Package
        run: |
          tar -C dist -czf mosdns-linux-armv7.tar.gz mosdns
          sha256sum mosdns-linux-armv7.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7
          path: mosdns-linux-armv7.tar.gz
          if-no-files-found: error
