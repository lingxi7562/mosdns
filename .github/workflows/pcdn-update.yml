name: pcdn-rule-update

on:
  schedule:
    # 每天 01:00 UTC（北京时间 09:00），避开高峰期
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  merge:
    name: merge PCDN rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-optimize
          fetch-depth: 1

      - name: Merge PCDN sources
        run: |
          python3 .github/scripts/merge_pcdn.py pcdn/pcdn2.txt
          echo "--- 合并结果预览 ---"
          head -8 pcdn/pcdn2.txt

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- pcdn/pcdn2.txt; then
            echo "No changes, skipping push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pcdn/pcdn2.txt
            git commit -m "pcdn: auto-update merged rules $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed update"
          fi
